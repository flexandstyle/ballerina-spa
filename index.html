<main id="top">

  </section>

  <!-- ============ FEATURES ============ -->

      <div class="fx-bg" style="background-image:url('assets/img/a1.jpg')"></div>

          <div class="fx-reveal"><div class="fx-grid" data-grid="1"></div><a href="#programs" class="btn-out fx-more" data-i18n="adv.more"></a></div>

        <span class="fx-dim"></span>
      </div>
      <div class="fx-col" data-fx="1" style="--fx-bg:url('assets/img/i1.jpg')">

          <p class="fx-desc" data-i18n="adv2.x"></p>

        </div>
        <span class="fx-dim"></span>
      </div>
      <div class="fx-col" data-fx="2" style="--fx-bg:url('assets/img/m1.jpg')">
        <div class="fx-col-inner">
          <h3 data-i18n="adv3.t"></h3>

        </div>
        <span class="fx-dim"></span>
      </div>
    </div>
    <p class="wrap fx-disc" data-i18n="disclaimer"></p>

      <button class="tsec-arrow" id="stripR" aria-label="next"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>

        </div>
        <div class="px-pointer"></div>
        <ul class="px-list" id="pxList"></ul>
      </div>
    </div>
  </section>
